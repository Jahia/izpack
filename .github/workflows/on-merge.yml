# Build IzPack and publish the snapshot to the Jahia Nexus, on every push to the
# maintained branch.
name: On merge to the maintained branch

on:
  push:
    branches:
      - '4.3'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish the snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set environment variables from parameters
        shell: bash
        run: |
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> "$GITHUB_ENV"
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> "$GITHUB_ENV"

      # The Ant build compiles with source and target 1.6, which JDK 11 refuses.
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      # maven-antrun-plugin runs the Ant build through ${env.ANT_EXE}.
      - name: Locate Ant
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ant >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ant
          fi
          echo "ANT_EXE=$(command -v ant)" >> "$GITHUB_ENV"

      - name: Deploy with Maven
        shell: bash
        run: >-
          mvn -s .github/maven.settings.xml -ntp -B
          -Dmaven.javadoc.skip=true -Dgpg.skip=true
          --file pom.xml clean deploy

      - name: Report where the artifact landed
        shell: bash
        run: |
          set -euo pipefail
          # actions/setup-java sets MAVEN_ARGS=-ntp, which hides every transfer line, so the
          # location is read from the project rather than from the Maven log.
          ev() {
            mvn -q -B -N -s .github/maven.settings.xml --file pom.xml \
              help:evaluate -Dexpression="$1" -DforceStdout
          }
          version="$(ev project.version)"
          case "$version" in
            *-SNAPSHOT) repository="$(ev project.distributionManagement.snapshotRepository.url)" ;;
            *)          repository="$(ev project.distributionManagement.repository.url)" ;;
          esac
          group="$(ev project.groupId | tr '.' '/')"
          artifact="$(ev project.artifactId)"
          echo "::notice title=Snapshot published::${repository%/}/$group/$artifact/$version/"
