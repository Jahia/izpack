# Release IzPack from a GitHub pre-release.
#
# To release, create a GitHub pre-release whose target is the maintained branch and whose tag is
# the version itself, for example 4.3.5-jahia13. This workflow deletes the tag GitHub created,
# because the Maven release plugin creates the real one on the release commit.
name: Trigger Release creation

on:
  release:
    types: [prereleased]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.target_commitish }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  on-release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.target_commitish }}
          ssh-key: ${{ secrets.GH_SSH_PRIVATE_KEY_JAHIACI }}

      # The release plugin pushes the release commit and the tag back to the branch.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.GH_SSH_PRIVATE_KEY_JAHIACI }}

      - name: Set environment variables from parameters
        shell: bash
        run: |
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> "$GITHUB_ENV"
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> "$GITHUB_ENV"

      # The Ant build compiles with source and target 1.6, which JDK 11 refuses.
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      # maven-antrun-plugin runs the Ant build through ${env.ANT_EXE}.
      - name: Locate Ant
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ant >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ant
          fi
          echo "ANT_EXE=$(command -v ant)" >> "$GITHUB_ENV"

      - name: Delete the tag GitHub created for the release
        shell: bash
        run: |
          git config user.email 'jahia-ci@jahia.com'
          git config user.name 'Jahia CI'
          git fetch --all --tags
          git tag --delete '${{ github.event.release.tag_name }}' || true
          git push origin ':refs/tags/${{ github.event.release.tag_name }}'

      - name: Compute the release and the next development version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          release='${{ github.event.release.tag_name }}'

          # A Jahia IzPack version ends in -jahia<N>, so the next development version raises N by one.
          case "$release" in
            *-jahia[0-9]*) ;;
            *)
              echo "::error::The tag $release does not end in -jahia<N>. Name the tag after the version, for example 4.3.5-jahia13."
              exit 1
              ;;
          esac
          base="${release%-jahia*}"
          revision="${release##*-jahia}"
          next="${base}-jahia$((revision + 1))-SNAPSHOT"

          {
            echo "release=$release"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Release plan::$release, then $next on ${{ github.event.release.target_commitish }}"

      - name: Release with Maven
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(-s .github/maven.settings.xml -B -Dmaven.javadoc.skip=true -Dgpg.skip=true)
          mvn -ntp "${ARGS[@]}" -DdryRun=false -DskipLocalStaging=true \
            -Dtag='${{ steps.versions.outputs.release }}' \
            -DreleaseVersion='${{ steps.versions.outputs.release }}' \
            -DdevelopmentVersion='${{ steps.versions.outputs.next }}' \
            -DscmCommentPrefix='[skip ci] [maven-release-plugin] ' \
            -Darguments="${ARGS[*]}" -Dusername=git release:prepare
          mvn -ntp "${ARGS[@]}" -DdryRun=false -DskipLocalStaging=true \
            -Darguments="${ARGS[*]}" -Dusername=git release:perform
